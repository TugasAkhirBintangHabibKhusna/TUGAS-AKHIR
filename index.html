<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Akhir - Polines</title>
    <style>
        /* === RESET GLOBAL === */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            -webkit-print-color-adjust: exact;
        }

        /* === 1. TAMPILAN DASHBOARD (HOME) === */
        #home-section {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px 0; /* Memberi sedikit padding vertical jika di layar HP */
        }
        .home-container {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        .logos { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .logos img { height: 70px; object-fit: contain; }
        .home-container h1 { font-size: 24px; color: #3b82f6; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .home-container h2 { font-size: 16px; font-weight: normal; color: #cbd5e1; margin-bottom: 30px; line-height: 1.5; }
        .button-group { display: flex; flex-direction: column; gap: 15px; }
        
        .btn { padding: 15px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; border: none; display: inline-block; }
        
        /* Tombol Poster */
        .btn-poster { background: linear-gradient(90deg, #2563eb, #1d4ed8); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        .btn-poster:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); }
        
        /* Tombol Download Jobsheet */
        .btn-download { background: linear-gradient(90deg, #10b981, #059669); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .btn-download:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); }

        /* Tombol G-Drive Video Tutorial */
        .btn-gdrive { background: linear-gradient(90deg, #f59e0b, #d97706); color: white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        .btn-gdrive:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6); }

        /* Tombol Program HMI */
        .btn-hmi { background: linear-gradient(90deg, #8b5cf6, #6d28d9); color: white; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        .btn-hmi:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6); }

        /* Tombol GitHub */
        .btn-github { background-color: #334155; color: white; border: 1px solid #475569; }
        .btn-github:hover { background-color: #475569; transform: translateY(-3px); }

        /* === 2. TAMPILAN POSTER (PDF) === */
        #poster-section {
            display: none;
            background-color: #1e293b;
            padding: 70px 20px 40px 20px; 
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .back-btn {
            position: fixed; 
            top: 20px;
            left: 20px;
            background-color: #334155;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .back-btn:hover { background-color: #475569; }

        /* Pengaturan khusus untuk iframe PDF */
        .poster-pdf {
            width: 100%;
            max-width: 1000px;
            height: 85vh; 
            border: none;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            background-color: #ffffff; 
        }

        /* --- PENGATURAN PRINT KE PDF --- */
        @media print {
            @page { size: A3; margin: 0; }
            body, html { background-color: white; padding: 0; margin: 0; }
            #home-section { display: none !important; } 
            #poster-section { display: flex !important; padding: 0; background-color: white; justify-content: center; align-items: center; height: 100vh;}
            .back-btn { display: none; } 
            .poster-pdf {
                box-shadow: none;
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div id="home-section">
        <div class="home-container">
            <div class="logos">
                <img src="images/logo-polines-bulat.png" alt="Logo Polines">
                <img src="images/logo-blu.png" alt="Logo BLU">
            </div>
            
            <h1>Tugas Akhir Polines</h1>
            <h2>IoT Sorting Training Set: Portable Trainer Box<br>with 75cm Conveyor Actuator</h2>
            
            <div class="button-group">
                <button class="btn btn-poster" onclick="showPoster()">&#128196; Lihat Poster (PDF)</button>
                <a href="JOBSHEET.docx" download class="btn btn-download">&#128197; Download Jobsheet (DOCX)</a>
                <a href="https://drive.google.com/drive/folders/1u8EQrBR2iJhh8bsDgE5okjzteiOyjIve?usp=sharing" target="_blank" class="btn btn-gdrive">&#127909; Video Tutorial (Google Drive)</a>
                <!-- TOMBOL PROGRAM HMI (NEW) -->
                <a href="https://drive.google.com/drive/folders/1S-iuO1phEbfIM2qCSm0z_uYxPyxrCILT" target="_blank" class="btn btn-hmi">&#128187; Program HMI (Google Drive)</a>
                <a href="https://github.com/TugasAkhirBintangHabibKhusna/TUGAS-AKHIR" target="_blank" class="btn btn-github">&#128279; Buka Source Code GitHub</a>
            </div>
        </div>
    </div>

    <div id="poster-section">
        <button class="back-btn" onclick="showHome()">&#8592; Kembali</button>
        
        <iframe src="dokumen/poster-a3.pdf" title="Poster Tugas Akhir" class="poster-pdf"></iframe>
        
    </div>

    <script>
        function showPoster() {
            document.getElementById('home-section').style.display = 'none';
            document.getElementById('poster-section').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        function showHome() {
            document.getElementById('poster-section').style.display = 'none';
            document.getElementById('home-section').style.display = 'flex';
        }
    </script>

</body>
</html>
