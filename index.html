<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Akhir IoT Sorting Training Set</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Kontainer Utama bertema Poster */
        .poster-container {
            background-color: #ffffff;
            max-width: 850px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-top: 10px solid #1e3c72;
            text-align: center;
            box-sizing: border-box;
        }
        /* Bagian Banner Poster Atas */
        .header-banner {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 35px 20px;
            border-radius: 8px;
            margin-bottom: 40px;
        }
        .header-banner h1 {
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .header-banner p {
            margin: 10px 0 0 0;
            font-size: 16px;
            opacity: 0.9;
        }
        /* Grid untuk 3 Anggota Kelompok */
        .team-grid {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 45px;
        }
        .member-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            width: 220px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .member-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db;
            margin-bottom: 15px;
            background-color: #e2e8f0; /* Warna dasar jika foto belum di-upload */
        }
        .member-name {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            margin: 5px 0;
            min-height: 40px; /* Menjaga teks tetap sejajar */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .member-nim {
            font-size: 13px;
            color: #7f8c8d;
            margin: 0;
        }
        /* Tombol menuju Kode GitHub */
        .btn-github {
            display: inline-block;
            background-color: #24292e;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-github:hover {
            background-color: #444d56;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <div class="header-banner">
            <h1>Tugas Akhir IoT Sorting Training Set</h1>
            <p>Sistem Otomatisasi & Pengolahan Data Berbasis Internet of Things</p>
        </div>

        <div class="team-grid">
            <div class="member-card">
                <img src="images/bintang.jpg" alt="Foto Bintang" class="member-img">
                <div class="member-name">Bintang Briliansyah</div>
                <div class="member-nim">NIM 3.32.23.0.08</div>
            </div>

            <div class="member-card">
                <img src="images/habib.jpg" alt="Foto Habib" class="member-img">
                <div class="member-name">Habib Husein Baydawi</div>
                <div class="member-nim">NIM 3.32.23.0.11</div>
            </div>

            <div class="member-card">
                <img src="images/khusna.jpg" alt="Foto Khusna" class="member-img">
                <div class="member-name">Khusna Khasanatur Rovia</div>
                <div class="member-nim">NIM 3.32.23.0.12</div>
            </div>
        </div>

        <a href="https://github.com/TugasAkhirBintangHabibKhusna/TUGAS-AKHIR/" target="_blank" class="btn-github">
            Buka File & Source Code GitHub
        </a>
    </div>

</body>
</html>
