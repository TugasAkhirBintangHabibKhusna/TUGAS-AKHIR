<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Tugas Akhir</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p {
            font-size: 16px;
            color: #7f8c8d;
            margin-top: 5px;
            margin-bottom: 25px;
        }
        /* Bagian Foto */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db;
            margin-bottom: 20px;
        }
        /* Bagian Tombol GitHub */
        .btn-github {
            display: inline-block;
            background-color: #24292e;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        .btn-github:hover {
            background-color: #444d56;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="foto-profil.jpg" alt="Foto Profil" class="profile-img">

        <h1>Selamat Datang</h1>
        <p>Halaman Proyek Tugas Akhir</p>

        <a href="https://github.com/TugasAkhirBintangHabibKhusna/TUGAS-AKHIR/" target="_blank" class="btn-github">
            Buka Source Code GitHub
        </a>
    </div>

</body>
</html>
